name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: Setup and uninstall on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/check_setup.ps1
      - name: Setup and uninstall on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_setup.ps1
      - name: Deployment, workspace and cache tests on PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/check_deployment.ps1
      - name: Deployment, workspace and cache tests on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_deployment.ps1
      - name: Booklet discovery on PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/check_booklet.ps1
      - name: Booklet discovery on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_booklet.ps1
      - name: Keep setup diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .zoi-checks/setup-test-*/*.log
            .zoi-checks/deploy-test-*/*.log
            .zoi-checks/booklet-test-*/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  booklet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: Install pinned Typst and PDF prerequisites
        run: |
          mkdir -p .zoi-checks/codex-work/booklet-tools
          curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o .zoi-checks/codex-work/booklet-tools/typst.tar.xz
          tar -xJf .zoi-checks/codex-work/booklet-tools/typst.tar.xz -C .zoi-checks/codex-work/booklet-tools
          echo "$PWD/.zoi-checks/codex-work/booklet-tools/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python3 -m venv .zoi-checks/codex-work/booklet-tools/venv
          .zoi-checks/codex-work/booklet-tools/venv/bin/pip install pypdf==6.0.0
      - name: Compile fixtures including long source and shared manuals
        shell: pwsh
        run: ./scripts/check_booklet.ps1 -Render
      - name: Rebuild the complete current booklet
        shell: pwsh
        run: ./scripts/make_booklet.ps1
      - name: Verify PDF contents, source pages, text and page-39 footer
        run: |
          .zoi-checks/codex-work/booklet-tools/venv/bin/python scripts/check_booklet_pdf.py docs/booklet/output/zoi-booklet-print.pdf
          for fixture in .zoi-checks/booklet-test-*; do
            .zoi-checks/codex-work/booklet-tools/venv/bin/python scripts/check_booklet_pdf.py "$fixture/out/book.pdf" --root "$fixture"
          done
      - name: Keep the current booklet and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: booklet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/booklet/output/zoi-booklet-print.pdf
            docs/booklet/output/zoi-booklet-print.typ
            .zoi-checks/booklet-test-*/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: Toolchain
        run: |
          g++ --version
          pwsh --version
      - name: Check generated test inventory
        shell: pwsh
        run: ./scripts/make_reliability.ps1 -Check
      - name: Check layout relocation and source discovery
        run: python3 scripts/check_layout.py --shell pwsh
      - name: Check generated feature catalog
        shell: pwsh
        run: ./scripts/make_features.ps1 -Check
      - name: Check documentation navigation and failure detection
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_docs.py --self-test
          python3 scripts/check_docs.py
          python3 scripts/check_design.py
      - name: Check inventory and generator behavior
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_inventory_test.ps1
      - name: Check verification evidence and tables
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_verification_test.ps1
      - name: Check runner failure paths
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check_runner.ps1
      - name: Check include expansion and recovery
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/zoi_check.ps1
      - name: Full regression
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/run_checks.ps1 -ReportDir .ci-results/regression
      - name: Syntax sweep (including warnings)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/run_checks.ps1 -Mode Syntax -ReportDir .ci-results/syntax
      - name: Keep reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/
            .zoi-checks/**/*.log
            .zoi-checks/**/summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  numeric-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [regression, sanitizer]
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: BigInt Python oracle and rw buffer/exit checks
        run: |
          if [ '${{ matrix.mode }}' = sanitizer ]; then
            python3 scripts/check_bigint_rw.py --sanitize --report-dir .ci-results/numeric-depth-${{ matrix.mode }}
          else
            python3 scripts/check_bigint_rw.py --report-dir .ci-results/numeric-depth-${{ matrix.mode }}
          fi
      - name: Keep numeric depth evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: numeric-depth-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/numeric-depth-*/summary.json
            .ci-results/numeric-depth-*/*.log
            .ci-results/numeric-depth-*/failure.txt
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [lca-vt, completed-graph]
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: Check stress failure classification
        run: python3 scripts/check_lca_vt_extreme.py --self-test
      - name: Target-scale checks and stack boundary reports
        if: ${{ !cancelled() }}
        run: python3 scripts/check_lca_vt_extreme.py --profile ${{ matrix.profile }} --report-dir .ci-results/stress-${{ matrix.profile }}
      - name: Keep stress diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: stress-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/stress-${{ matrix.profile }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize source layout
        shell: pwsh
        run: ./scripts/sync_layout.ps1
      - name: Toolchain
        run: g++ --version
      - name: ASan and UBSan regression
        shell: pwsh
        run: ./scripts/run_checks.ps1 -Sanitize -TimeoutSec 180 -CompileTimeoutSec 180 -ReportDir .ci-results/sanitizer
      - name: Keep sanitizer diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: sanitizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
